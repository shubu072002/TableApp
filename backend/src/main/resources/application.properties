spring.application.name=table-export
server.port=8080

# No fixed database: users enter host / user / password in the UI and the backend
# opens a small connection pool per session (see ConnectionRegistry).
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# A session (open DB connection pool) is closed after this many idle minutes
app.session.idle-minutes=30
# Maximum number of DB sessions open at the same time
app.session.max=50

# Rows fetched per round-trip while streaming a table out
app.export.fetch-size=2000

# ---------------- Uploads (import into a table) ----------------
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB
# Rows sent to the database per batch while importing
app.import.batch-size=1000
# Uploaded files not imported within this time are deleted
app.import.expiry-minutes=30

# React dev server allowed to call the API (comma separated)
app.cors.allowed-origins=http://localhost:5173

# Long downloads: no async timeout for streaming responses
spring.mvc.async.request-timeout=-1
